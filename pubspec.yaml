name: bodmediary
description: 신생아 관리 히스토리 (수유 · 기저귀 · 잠) 가족 공유 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.0.4
  firebase_app_check: ^0.3.1+4
  firebase_crashlytics: ^4.0.4

  # Camera / image
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.68.0

  # i18n / time
  intl: ^0.20.0
  timezone: ^0.10.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utils
  uuid: ^4.4.2
  shared_preferences: ^2.3.0
  share_plus: ^13.1.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  generate: true
